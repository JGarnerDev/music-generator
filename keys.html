<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `user-scalable=no` because this page is an instrument: a two-finger
      interval on a drawn keyboard is a pinch, and a pinch that zooms moves the
      keys out from under the hand mid-phrase. `viewport-fit=cover` lets the
      keyboard reach the bottom edge of a notched phone; the CSS pays the safe
      area back where it matters.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14121a" />
    <title>music-generator — keys bench</title>

    <!-- Installed to a home screen, it is an app: no browser chrome, its own
         icon, and (in the standalone build) a service worker so it opens with
         no signal. See docs/deploy.md. -->
    <link rel="manifest" href="./keys.webmanifest" />
    <link rel="apple-touch-icon" href="./keys-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./keys-icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="keys" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <!-- The page is React from here down: src/app/pages/Keys.tsx renders the
         <main>, and src/app/keys.css carries the styles. -->
    <div id="root"></div>
    <script type="module" src="/src/app/keys-main.tsx"></script>
  </body>
</html>

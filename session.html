<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>music-generator — session board</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        color-scheme: dark;
        --bg: #14121a;
        --panel: #2a2440;
        --panel-hi: #362e52;
        --line: #443a66;
        --ink: #e8e4f0;
        --accent: #b6a6e6;
        --warn: #ffb4c4;
      }
      /*
       * Same discipline as the composition bench, for a harder reason: this page
       * is used at a table with people waiting, in a room that is usually dark.
       * Nothing may move. The transport sits at a fixed place at the bottom, the
       * cue list takes the slack above it, and switching tabs cannot shift either
       * — you learn where Play is with your hand, not your eyes.
       */
      body {
        font-family: ui-monospace, "Cascadia Code", monospace;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        justify-content: center;
        align-content: start;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem 0 1.2rem;
      }
      main {
        width: min(860px, 94vw);
        height: calc(100vh - 2.7rem);
        min-height: 40rem;
        max-height: 56rem;
        display: grid;
        grid-template-rows:
          auto /* title */
          auto /* session picker */
          auto /* tabs */
          minmax(10rem, 1fr) /* the open panel — absorbs the slack */
          auto auto auto auto auto auto; /* now playing · scrub · transport · volume · status · keys */
        gap: 0.7rem;
      }
      h1 {
        font-size: 1.1rem;
        color: var(--accent);
        letter-spacing: 0.02em;
        margin: 0;
        height: 1.4rem;
        line-height: 1.4rem;
      }
      h1 a { color: inherit; opacity: 0.45; text-decoration: none; font-size: 0.8rem; float: right; margin-left: 0.8rem; }
      h1 a:hover { opacity: 0.9; }
      .row { display: flex; gap: 0.6rem; }

      /* ── Session picker ───────────────────────────────────────────────── */
      #pickerRow { display: flex; gap: 0.6rem; align-items: stretch; }
      #sessionPick {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0.5rem 0.7rem;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        font-size: 0.85rem;
      }
      #pickerRow button {
        flex: 0 0 auto;
        height: auto;
        padding: 0 0.9rem;
        font-size: 0.85rem;
      }

      /* ── Tabs ─────────────────────────────────────────────────────────── */
      #tabs {
        display: flex;
        gap: 0.35rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.4rem;
      }
      .tab {
        flex: 1 1 0;
        min-width: 0;
        height: auto;
        padding: 0.45rem 0.6rem;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        color: var(--ink);
        opacity: 0.6;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .tab:hover { opacity: 0.9; background: var(--panel); }
      .tab[aria-selected="true"] {
        opacity: 1;
        background: var(--panel);
        border-color: var(--line);
        color: var(--accent);
      }
      .tab .count { opacity: 0.55; margin-left: 0.35rem; }

      /*
       * Both panels live in the same grid cell, so the tab you are not on takes
       * up exactly as much room as the one you are — switching never resizes the
       * page.
       */
      #panels { display: grid; min-height: 0; }
      #panels > section {
        grid-area: 1 / 1;
        min-height: 0;
        display: grid;
        gap: 0.5rem;
        grid-template-rows: auto minmax(0, 1fr);
      }
      #panels > section[hidden] { display: none; }
      #archivePanel { grid-template-rows: auto auto minmax(0, 1fr); }

      #planTitle {
        font-size: 0.95rem;
        color: var(--accent);
        height: 1.3rem;
        line-height: 1.3rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #planMeta {
        font-size: 0.75rem;
        opacity: 0.5;
        height: 1rem;
        line-height: 1rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #planMeta.warn { color: var(--warn); opacity: 0.9; }
      .planHead { display: grid; gap: 0.15rem; }

      /* ── Tables ───────────────────────────────────────────────────────── */
      .tableWrap {
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 0;
        overflow-y: scroll;
      }
      .tableWrap::-webkit-scrollbar { width: 10px; }
      .tableWrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
      table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 0.85rem; }
      tr { border-bottom: 1px solid #241f38; }
      tr:last-child { border-bottom: none; }
      tr:hover { background: #1d1a2b; }
      tr[aria-selected="true"] { background: var(--panel); }
      tr.bad { background: #2a1c26; }
      tr.bad:hover { background: #331f2c; }
      td {
        height: 2.4rem;
        padding: 0 0.4rem;
        vertical-align: middle;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      td.cell-play, td.cell-delete, td.cell-loop, td.cell-add, td.cell-key { text-align: center; padding: 0; }
      td.cell-move { text-align: center; padding: 0; white-space: nowrap; }
      td.cell-len { text-align: right; opacity: 0.55; font-size: 0.78rem; }
      td.cell-name { font-weight: 600; }
      .col-key { width: 2rem; }
      .col-play { width: 2.4rem; }
      .col-len { width: 3.4rem; }
      .col-loop { width: 2.4rem; }
      .col-move { width: 3.6rem; }
      .col-delete, .col-add { width: 2.4rem; }
      .col-name { width: 46%; }

      .key { opacity: 0.35; font-size: 0.75rem; }
      td.cell-name .kind { opacity: 0.4; font-weight: 400; font-size: 0.75rem; margin-left: 0.4rem; }
      /* The note is the cue's reason for existing — same line as the name, dimmer. */
      .note {
        display: inline-block;
        margin-left: 0.6rem;
        font-weight: 400;
        font-size: 0.78rem;
        opacity: 0.7;
        cursor: text;
      }
      .note:hover { opacity: 1; color: var(--accent); }
      .note.empty { opacity: 0.3; }
      tr.bad .note { color: var(--warn); opacity: 0.85; }
      td.cell-tags { opacity: 0.75; }
      .chip {
        display: inline-block;
        padding: 0.05rem 0.4rem;
        margin: 0 0.2rem 0 0;
        line-height: 1.35;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.7rem;
        opacity: 0.85;
      }
      .chip.campaign { border-color: var(--accent); color: var(--accent); }
      .empty { padding: 1.2rem 0.6rem; text-align: center; opacity: 0.45; font-size: 0.85rem; }

      /* ── Archive filters ──────────────────────────────────────────────── */
      #filters { display: flex; gap: 0.5rem; align-items: center; }
      #campaigns { display: flex; gap: 0.3rem; flex: 0 0 auto; }
      .chip-button {
        flex: 0 0 auto;
        height: auto;
        padding: 0.3rem 0.7rem;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        opacity: 0.55;
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
      }
      .chip-button:hover { opacity: 0.9; background: var(--panel); }
      .chip-button[aria-pressed="true"] { opacity: 1; background: var(--panel); border-color: var(--accent); color: var(--accent); }
      #search {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0.45rem 0.7rem;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        font-size: 0.85rem;
      }

      /* ── Transport ────────────────────────────────────────────────────── */
      #nowPlaying {
        font-size: 0.95rem;
        height: 1.4rem;
        line-height: 1.4rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.9;
      }
      .scrub { display: flex; align-items: center; gap: 0.6rem; height: 1.6rem; }
      .scrub-time { font-size: 0.75rem; opacity: 0.55; width: 3.2rem; flex: none; }
      .scrub-time:last-child { text-align: right; }
      .scrub-track {
        flex: 1 1 auto;
        height: 0.8rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        overflow: hidden;
        cursor: pointer;
        touch-action: none; /* a drag on the bar scrubs; it never scrolls the page */
      }
      .scrub-track:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .scrub-fill { height: 100%; width: 0%; background: var(--accent); opacity: 0.75; }
      /* Nothing loaded: still exactly the same size, so the page never reflows. */
      .scrub.idle .scrub-track { cursor: default; opacity: 0.4; }

      /*
       * The fader sits under the transport, same height whatever it reads: the
       * level is set once for the room and then left alone, so it must not
       * compete with Play for the eye — or ever move it.
       */
      #volumeRow { display: flex; align-items: center; gap: 0.6rem; height: 1.6rem; }
      #volume {
        flex: 1 1 auto;
        min-width: 0;
        height: 0.8rem;
        margin: 0;
        appearance: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
      }
      #volume::-webkit-slider-thumb {
        appearance: none;
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        cursor: pointer;
      }
      #volume::-moz-range-thumb {
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        cursor: pointer;
      }
      #volume:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #volumeRow.muted #volume { opacity: 0.35; }
      #volumeRow.muted #volumeRead { text-decoration: line-through; }
      #volumeRead { width: 3.2rem; text-align: right; }

      button {
        flex: 1 1 0;
        min-width: 0;
        height: 3.1rem;
        padding: 0 1rem;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: var(--panel-hi); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .icon {
        flex: none;
        height: auto;
        padding: 0.25rem 0.4rem;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        color: inherit;
        font: inherit;
        cursor: pointer;
        opacity: 0.7;
      }
      .icon:hover:not(:disabled) { background: var(--panel-hi); opacity: 1; }
      .icon:disabled { opacity: 0.2; cursor: not-allowed; }
      .icon.danger:hover:not(:disabled) { background: #4a2233; color: var(--warn); }
      .icon.toggle.on { color: var(--accent); opacity: 1; }
      #status {
        height: 2.6em;
        line-height: 1.3em;
        overflow: hidden;
        opacity: 0.7;
        font-size: 0.9rem;
      }
      .hint { font-size: 0.72rem; opacity: 0.4; }
    </style>
  </head>
  <body>
    <main>
      <h1>music-generator · session board<a href="/">bench →</a><a href="/voices.html">voices →</a></h1>

      <div id="pickerRow">
        <select id="sessionPick" aria-label="Session"></select>
        <button id="newSession" title="Start a new session">＋ New</button>
        <button id="deleteSession" title="Delete this session plan">🗑</button>
      </div>

      <nav id="tabs" role="tablist" aria-label="Session board"></nav>

      <div id="panels">
        <section id="sessionPanel" role="tabpanel" aria-label="Session">
          <div class="planHead">
            <div id="planTitle">loading…</div>
            <div id="planMeta"></div>
          </div>
          <div class="tableWrap">
            <table>
              <colgroup>
                <col class="col-key" />
                <col class="col-play" />
                <col class="col-name" />
                <col class="col-len" />
                <col class="col-loop" />
                <col class="col-move" />
                <col class="col-delete" />
              </colgroup>
              <tbody id="cueRows"></tbody>
            </table>
            <div id="cueEmpty" class="empty" hidden></div>
          </div>
        </section>

        <section id="archivePanel" role="tabpanel" aria-label="Archive" hidden>
          <div id="filters">
            <div id="campaigns"></div>
            <input id="search" type="search" placeholder="filter by name or tag…" aria-label="Filter the archive" />
          </div>
          <div class="tableWrap">
            <table>
              <colgroup>
                <col class="col-play" />
                <col class="col-name" />
                <col class="col-tags" />
                <col class="col-add" />
              </colgroup>
              <tbody id="archiveRows"></tbody>
            </table>
            <div id="archiveEmpty" class="empty" hidden></div>
          </div>
        </section>
      </div>

      <div id="nowPlaying">Nothing playing</div>
      <div id="scrub" class="scrub idle"></div>
      <div class="row">
        <button id="toggle">▶ Play</button>
        <button id="stop">■ Stop</button>
      </div>
      <div id="volumeRow">
        <button id="mute" class="icon" title="Mute (m)" aria-label="Mute">🔊</button>
        <input id="volume" type="range" min="0" max="100" step="1" value="80" aria-label="Volume" />
        <span id="volumeRead" class="scrub-time">80%</span>
      </div>
      <div id="status"></div>
      <div class="hint">Keys: 1–9 fire that cue · space plays/pauses · esc stops · ←/→ scrub 5s · ↑/↓ volume · m mutes</div>
    </main>
    <script type="module" src="/src/app/session-main.ts"></script>
  </body>
</html>

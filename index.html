<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>music-generator — workshop bench</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: ui-monospace, "Cascadia Code", monospace;
        background: #14121a;
        color: #e8e4f0;
        display: grid;
        place-content: center;
        min-height: 100vh;
        margin: 0;
      }
      main { width: min(560px, 90vw); }
      h1 { font-size: 1.1rem; color: #b6a6e6; letter-spacing: 0.02em; }
      #title { opacity: 0.85; margin-bottom: 1rem; }
      .row { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
      select {
        flex: 1;
        padding: 0.6rem 0.7rem;
        background: #2a2440;
        color: #e8e4f0;
        border: 1px solid #443a66;
        border-radius: 8px;
        font: inherit;
      }
      #drop {
        border: 1px dashed #443a66;
        border-radius: 8px;
        padding: 0.9rem;
        text-align: center;
        font-size: 0.85rem;
        opacity: 0.6;
        margin-bottom: 1rem;
        cursor: pointer;
      }
      #drop.over { border-color: #b6a6e6; opacity: 1; background: #221d33; }
      button {
        flex: 1;
        padding: 0.7rem 1rem;
        background: #2a2440;
        color: #e8e4f0;
        border: 1px solid #443a66;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #362e52; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      #status { min-height: 1.4em; opacity: 0.7; font-size: 0.9rem; }
      .check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        opacity: 0.8;
        margin-bottom: 1rem;
        cursor: pointer;
      }
      .check.disabled { opacity: 0.35; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <main>
      <h1>music-generator · workshop bench</h1>
      <div id="title">loading…</div>
      <div class="row">
        <select id="composition" aria-label="Choose a composition"></select>
      </div>
      <div id="drop">Drop a composition .json here, or click to browse</div>
      <input id="file" type="file" accept="application/json,.json" hidden />
      <div class="row">
        <button id="play">▶ Play</button>
        <button id="stop">■ Stop</button>
      </div>
      <div class="row">
        <button id="export">⬇ Export WAV</button>
        <button id="exportLoop" title="Seamless loop body only">⬇ Export Loop</button>
      </div>
      <label id="loopRow" class="check">
        <input id="loop" type="checkbox" checked />
        <span>Loop playback (intro once, then repeat the body)</span>
      </label>
      <div id="status"></div>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
